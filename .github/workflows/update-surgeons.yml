name: Monthly EndoFind data update

on:
  schedule:
    - cron: '0 6 1 * *'  # 1st of every month at 6am UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Refresh news snapshot
        run: python scripts/update_endo_news.py
        continue-on-error: true

      - name: Run surgeon scraper
        run: python scripts/update_surgeons.py
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "EndoFind Bot"
          git config user.email "actions@github.com"
          git add data/surgeons.json data/update_log.json data/news.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Monthly EndoFind data update $(date +'%Y-%m-%d')"
            git push
          fi
